name: CI

# 로컬은 커밋 안 한 파일·local.properties까지 쓰고 돈다 — 커밋된 것만으로 되는지 여기서 본다
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint·단위 테스트·빌드
    runs-on: ubuntu-24.04
    steps:
      - name: 코드 받기
        uses: actions/checkout@v6

      # Gradle 데몬이 JDK 21을 요구한다(gradle/gradle-daemon-jvm.properties)
      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: lint
        run: ./gradlew :app:lintDevDebug
      - name: 단위 테스트
        run: ./gradlew :app:testDevDebugUnitTest
      - name: 빌드
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebug